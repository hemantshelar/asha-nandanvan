name: CI/CD

on:
  push:
    branches:
      - feature/002-squre-pay
  pull_request:
  workflow_dispatch:

concurrency:
  group: ashanandanvan-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_RESOURCE_GROUP: ashanandanvan-dev
  WEBAPP_NAME: app-ashanandanvan-dev

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore AshaNandanvan.slnx

      - name: Build
        run: dotnet build AshaNandanvan.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/AshaNandanvan.Web/AshaNandanvan.Web.csproj --configuration Release --output ./publish

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish
          if-no-files-found: error
          retention-days: 7

  provision:
    name: Provision Azure (Bicep)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      webAppName: ${{ steps.deploy.outputs.webAppName }}
      webAppPrincipalId: ${{ steps.deploy.outputs.webAppPrincipalId }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Azure OIDC secrets
        env:
          CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
          SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "AZURE_CLIENT_ID length=${#CLIENT} (expect 36)"
          echo "AZURE_TENANT_ID length=${#TENANT} (expect 36)"
          echo "AZURE_SUBSCRIPTION_ID length=${#SUB} (expect 36)"
          if [ ${#CLIENT} -ne 36 ] || [ ${#TENANT} -ne 36 ] || [ ${#SUB} -ne 36 ]; then
            echo "One or more Azure IDs are missing or have extra spaces. Re-save the dev environment secrets."
            exit 1
          fi

      - name: Azure login
        id: azure-login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: What-if
        env:
          SQL_ENTRA_ADMIN_LOGIN: ${{ secrets.SQL_ENTRA_ADMIN_LOGIN }}
          SQL_ENTRA_ADMIN_OBJECT_ID: ${{ secrets.SQL_ENTRA_ADMIN_OBJECT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SQUARE_APPLICATION_ID: ${{ secrets.SQUARE_APPLICATION_ID }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
        run: >
          az deployment group what-if
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
          --name ashanandanvan-dev-${{ github.run_number }}
          --template-file infra/main.bicep
          --parameters infra/parameters/dev.bicepparam
          sqlEntraAdminLogin="$SQL_ENTRA_ADMIN_LOGIN"
          sqlEntraAdminObjectId="$SQL_ENTRA_ADMIN_OBJECT_ID"
          googleClientId="$GOOGLE_CLIENT_ID"
          googleClientSecret="$GOOGLE_CLIENT_SECRET"
          squareApplicationId="$SQUARE_APPLICATION_ID"
          squareAccessToken="$SQUARE_ACCESS_TOKEN"
          squareLocationId="$SQUARE_LOCATION_ID"
          adminSeedEmail="$ADMIN_SEED_EMAIL"

      - name: Deploy Bicep
        id: deploy
        env:
          SQL_ENTRA_ADMIN_LOGIN: ${{ secrets.SQL_ENTRA_ADMIN_LOGIN }}
          SQL_ENTRA_ADMIN_OBJECT_ID: ${{ secrets.SQL_ENTRA_ADMIN_OBJECT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SQUARE_APPLICATION_ID: ${{ secrets.SQUARE_APPLICATION_ID }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
        run: |
          result=$(az deployment group create \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "ashanandanvan-dev-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            sqlEntraAdminLogin="$SQL_ENTRA_ADMIN_LOGIN" \
            sqlEntraAdminObjectId="$SQL_ENTRA_ADMIN_OBJECT_ID" \
            googleClientId="$GOOGLE_CLIENT_ID" \
            googleClientSecret="$GOOGLE_CLIENT_SECRET" \
            squareApplicationId="$SQUARE_APPLICATION_ID" \
            squareAccessToken="$SQUARE_ACCESS_TOKEN" \
            squareLocationId="$SQUARE_LOCATION_ID" \
            adminSeedEmail="$ADMIN_SEED_EMAIL" \
            --query properties.outputs -o json)
          echo "webAppName=$(echo "$result" | jq -r '.webAppName.value')" >> "$GITHUB_OUTPUT"
          echo "webAppPrincipalId=$(echo "$result" | jq -r '.webAppPrincipalId.value')" >> "$GITHUB_OUTPUT"

      - name: Allow GitHub runner on SQL firewall
        id: sql-fw
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group invitation-web-group \
            --server invitation \
            --name "gha-${{ github.run_id }}" \
            --start-ip-address "$ip" \
            --end-ip-address "$ip"

      - name: Grant web app identity access to SQL
        uses: azure/sql-action@v2
        with:
          connection-string: Server=tcp:invitation.database.windows.net,1433;Initial Catalog=ashanandanvan-dev;Encrypt=True;Authentication=Active Directory Default;
          path: ./infra/scripts/grant-app-sql-access.sql

      - name: Remove GitHub runner SQL firewall rule
        if: always() && steps.sql-fw.outcome == 'success'
        run: |
          az sql server firewall-rule delete \
            --resource-group invitation-web-group \
            --server invitation \
            --name "gha-${{ github.run_id }}"

  deploy:
    name: Deploy web app
    needs: provision
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: ./publish
